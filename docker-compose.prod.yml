version: '3.8'

services:
  front:
    image: ${ECR_REGISTRY}/uncle/nextjs:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - users-service
      - vehicles-service
    restart: always

  users-service:
    image: ${ECR_REGISTRY}/uncle/nestjs:latest
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - rabbitmq
    restart: always

  vehicles-service:
    image: ${ECR_REGISTRY}/uncle/express:latest
    ports:
      - "3002:3002"
    env_file:
      - .env
    depends_on:
      - mongodb
      - rabbitmq
    restart: always

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_INITDB_DATABASE}
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data: